# Generated by tools/delivery/render-dependencies.py; edit its template/pins.
name: fmonitor2-pilot

services:
  pilot:
    image: fmonitor2-pilot
    build:
      context: .
    environment:
      FMONITOR_DEMO_DB_HOST: mariadb
      FMONITOR_DEMO_DB_PORT: "3306"
      FMONITOR_DEMO_DB_NAME: fmonitor2_demo
      FMONITOR_DEMO_DB_USER: fmonitor2_demo
      FMONITOR_DEMO_DB_PASSWORD: fmonitor2_demo_local
      FMONITOR_DEMO_PORT: "8092"
      FMONITOR_SESSION_STATE_ROOT: /home/fmonitor/.local/state/fmonitor2
      FMONITOR_SESSION_INSTANCE: pilot
      FMONITOR_TRUSTED_REQUEST_SCHEME: http
      FMONITOR_BOOTSTRAP_SUPERADMIN_EMAILS: "${FMONITOR_BOOTSTRAP_SUPERADMIN_EMAILS:-ts.grishin@shlz.ru}"
      FMONITOR_BOOTSTRAP_SUPERADMIN_PASSWORD: "${FMONITOR_BOOTSTRAP_SUPERADMIN_PASSWORD:?Set bootstrap superadministrator password in .env}"
    ports:
      - "127.0.0.1:8092:8092"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pilot-state:/home/fmonitor/.local/state/fmonitor2
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "rapid-pilot/healthcheck.sh"]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  workforce-sync:
    image: fmonitor2-pilot
    pull_policy: never
    user: "0:0"
    entrypoint: ["php", "bin/yii", "jobs/worker", "--interactive=0"]
    environment:
      FMONITOR_DB_HOST: mariadb
      FMONITOR_DB_PORT: "3306"
      FMONITOR_DB_NAME: fmonitor2_demo
      FMONITOR_DB_USER: fmonitor2_demo
      FMONITOR_DB_PASSWORD: fmonitor2_demo_local
      FMONITOR_BITRIX_CONFIG: /run/secrets/bitrix-workforce
      FMONITOR_SESSION_STATE_ROOT: /home/fmonitor/.local/state/fmonitor2
      FMONITOR_SESSION_INSTANCE: pilot
    volumes:
      - pilot-state:/home/fmonitor/.local/state/fmonitor2:ro
    secrets:
      - bitrix-workforce
    depends_on:
      pilot:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "bin/yii", "jobs/health", "--interactive=0"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    stop_signal: SIGTERM
    stop_grace_period: 60s
    restart: unless-stopped

  workforce-scheduler:
    image: fmonitor2-pilot
    pull_policy: never
    user: "0:0"
    entrypoint: ["php", "bin/yii", "jobs/scheduler", "--interactive=0"]
    environment:
      FMONITOR_DB_HOST: mariadb
      FMONITOR_DB_PORT: "3306"
      FMONITOR_DB_NAME: fmonitor2_demo
      FMONITOR_DB_USER: fmonitor2_demo
      FMONITOR_DB_PASSWORD: fmonitor2_demo_local
      FMONITOR_SESSION_STATE_ROOT: /home/fmonitor/.local/state/fmonitor2
      FMONITOR_SESSION_INSTANCE: pilot
    volumes:
      - pilot-state:/home/fmonitor/.local/state/fmonitor2:ro
    depends_on:
      pilot:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "bin/yii", "jobs/health", "--interactive=0"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    stop_signal: SIGTERM
    stop_grace_period: 60s
    restart: unless-stopped

  mariadb:
    image: mariadb:11.4.7-noble
    environment:
      MARIADB_DATABASE: fmonitor2_demo
      MARIADB_USER: fmonitor2_demo
      MARIADB_PASSWORD: fmonitor2_demo_local
      MARIADB_ROOT_PASSWORD: fmonitor2_demo_root_local
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

volumes:
  mariadb-data:
  pilot-state:

secrets:
  bitrix-workforce:
    file: ./.local/bitrix-workforce.json
