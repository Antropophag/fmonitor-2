version: 0
provider:
  name: github
  configuration:
    default-branch: main
    runtime:
      action: alchemmist/quality-graph@caf5366a04ca01b230f1df5585d0fbd9693d7bef
      upload-artifact-action: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
profiles:
  default:
    runner: ubuntu-latest
    permissions:
      contents: read
    setup:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: 'false'
        fetch-depth: '0'
    - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
      with:
        php-version: '8.5'
        extensions: mysqli, pcntl, dom, mbstring
        coverage: none
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      with:
        version: 0.8.15
        python-version: 3.12.11
        enable-cache: 'false'
    - name: Install locked Quality Graph toolchain
      run: 'uv sync --frozen

        printf "%s/.venv/bin\n" "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"'
  verification:
    extends: default
    setup:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.22.0
    - name: Prepare exact repository verification dependencies
      run: make ci-setup
    timeout-minutes: 60
nodes:
  graph-validation:
    title: Quality Graph declaration and publisher validation
    run: make quality-graph-validate
    policy:
      blocking: true
      approvals:
        findings: false
        files: false
        node: false
  delivery-evidence:
    title: SSD/TDD delivery evidence
    needs:
    - graph-validation
    run: make delivery-evidence-check
    policy:
      blocking: true
      approvals:
        findings: false
        files: false
        node: false
  verify:
    title: Repository verification
    needs:
    - delivery-evidence
    run: make fresh-test-verify
    policy:
      blocking: true
      approvals:
        findings: false
        files: false
        node: false
    profile: verification
