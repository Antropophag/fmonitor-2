pid /tmp/nginx.pid;
error_log /dev/stderr notice;
worker_processes auto;

events { worker_connections 1024; }

http {
    log_format safe_json escape=json '{"request_id":"$request_id","method":"$request_method","uri":"$uri","status":$status,"request_time":"$request_time","upstream_status":"$upstream_status","upstream_response_time":"$upstream_response_time"}';
    access_log /dev/stdout safe_json;
    client_body_temp_path /tmp/nginx-client-body;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    proxy_temp_path /tmp/nginx-proxy;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 28m;

    server {
        listen 8080;
        server_name _;
        root /workspace/fmonitor-2/public;

        location ^~ /pilot/assets/ {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /workspace/fmonitor-2/public/yii.php;
            fastcgi_param SCRIPT_NAME /yii.php;
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_pass php:9000;
        }

        location = /pilot/activate {
            error_log /dev/null;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /workspace/fmonitor-2/public/yii.php;
            fastcgi_param SCRIPT_NAME /yii.php;
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_read_timeout 60s;
            fastcgi_pass php:9000;
        }

        location / {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /workspace/fmonitor-2/public/yii.php;
            fastcgi_param SCRIPT_NAME /yii.php;
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_read_timeout 60s;
            fastcgi_pass php:9000;
        }

        location ~ \.php(?:/|$) { return 404; }
    }
}
