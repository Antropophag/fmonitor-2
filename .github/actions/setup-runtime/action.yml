name: Pinned verification runtimes
description: Install the runtime prerequisites from the shared development manifest.
runs:
  using: composite
  steps:
    - name: Read shared pins
      shell: bash
      run: |
        python3 tools/delivery/render-dependencies.py --env >> "$GITHUB_ENV"
    - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: ${{ env.PHP_EXTENSIONS }}
        coverage: none
        tools: none
    - name: Install locked Composer dependencies
      shell: bash
      run: bash tools/delivery/setup-composer.sh
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      with:
        version: ${{ env.UV_VERSION }}
        python-version: ${{ env.PYTHON_VERSION }}
        enable-cache: 'false'
    - name: Select pinned Python
      shell: bash
      run: |
        uv python install "$PYTHON_VERSION"
        dirname "$(uv python find --no-project "$PYTHON_VERSION")" >> "$GITHUB_PATH"
    - name: Verify pinned Python
      shell: bash
      run: python3 -c 'import os, platform; assert platform.python_version() == os.environ["PYTHON_VERSION"]'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Verify bundled npm
      shell: bash
      run: test "$(npm --version)" = "$NPM_VERSION"
    - name: Prepare lightweight test dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ripgrep
