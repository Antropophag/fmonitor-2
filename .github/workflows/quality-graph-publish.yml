# Generated by Quality Graph. DO NOT EDIT MANUALLY. Update quality-graph.yml and run qg generate.
---
name: Quality Graph Publisher
'on':
  workflow_run:
    workflows:
      - Quality Graph
    types:
      - requested
      - in_progress
      - completed
permissions: {}
concurrency:
  group: quality-graph-publish-${{ github.event.workflow_run.id || github.event.issue.number }}
  cancel-in-progress: false
jobs:
  publish:
    name: Publish Quality Graph
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
    steps:
      - name: Publish trusted Quality Graph state
        uses: alchemmist/quality-graph@caf5366a04ca01b230f1df5585d0fbd9693d7bef
        with:
          operation: ${{ github.event.action == 'completed' && 'publish' || 'watch' }}
