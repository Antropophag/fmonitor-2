# Generated by Quality Graph. DO NOT EDIT MANUALLY. Update quality-graph.yml and run qg generate.
---
name: Quality Graph
'on':
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: quality-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  graph-validation:
    name: Quality Graph declaration and publisher validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: 'false'
          fetch-depth: '0'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: mysqli, pcntl, dom, mbstring
          coverage: none
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: 0.8.15
          python-version: 3.12.11
          enable-cache: 'false'
      - name: Install locked Quality Graph toolchain
        run: 'uv sync --frozen

          printf "%s/.venv/bin\n" "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"'
      - run: make quality-graph-validate
        name: Run Quality Graph declaration and publisher validation
        id: quality-command
        continue-on-error: true
      - name: Collect Quality Graph declaration and publisher validation result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@caf5366a04ca01b230f1df5585d0fbd9693d7bef
        with:
          operation: collect
          node-id: graph-validation
          title: Quality Graph declaration and publisher validation
          adapter: exit-code
          report-path: ''
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: 95ab7381b6ce103c5ab3cce6fbb54826cf227470f4a7288894e30d74949ea325
          approval-findings: 'false'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload Quality Graph declaration and publisher validation result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: quality-result-graph-validation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/graph-validation.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Quality Graph declaration and publisher validation result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
  delivery-evidence:
