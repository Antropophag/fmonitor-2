# TEST ONLY DO NOT MERGE — synthetic Quality Graph Phase B transport fixture.
name: Quality Graph
'on':
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: qg-phase-b-${{ github.event.pull_request.number }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      full: ${{ steps.policy.outputs.full }}
    steps:
    - name: TEST ONLY synthetic full selection
      id: policy
      run: echo 'full=true' >> "$GITHUB_OUTPUT"
  fast:
    name: fast
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: TEST ONLY synthetic success
      run: 'true'
  unit:
    name: unit
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: TEST ONLY synthetic category outcome
      run: "true"
  integration:
    name: Integration
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: TEST ONLY synthetic success; no database or production test
      run: 'true'
  e2e:
    name: e2e
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: TEST ONLY synthetic success; no browser or production test
      run: 'true'
  governance:
    name: governance
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: TEST ONLY synthetic success
      run: 'true'
  verify:
    name: verify
    if: always()
    needs: [plan, fast, unit, integration, e2e, governance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: TEST ONLY synthetic aggregate outcome; not production verification
      run: "true"
  quality-results:
    if: always() && github.event_name == 'pull_request'
    needs: [plan, fast, unit, integration, e2e, governance, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: 'false'
        fetch-depth: '0'
    - name: Render native Quality Graph reports
      id: reports
      env:
        FULL: ${{ needs.plan.outputs.full || 'unknown' }}
        RESULTS: '{"plan":"${{ needs.plan.result }}","fast":"${{ needs.fast.result }}","unit":"${{ needs.unit.result }}","integration":"${{ needs.integration.result }}","e2e":"${{ needs.e2e.result }}","governance":"${{ needs.governance.result }}","verify":"${{ needs.verify.result }}"}'
      run: python3 tools/delivery/quality-graph-report.py --full "$FULL" --results-json "$RESULTS" --graph-digest ed77954b8e7e5aa796e0384c741919ba3e3b74813e65e9dd4e99c643422c4b56 --output-dir .quality-graph/reports
    - name: Collect plan
      id: collect-plan
      if: always()
      uses: alchemmist/quality-graph@caf5366a04ca01b230f1df5585d0fbd9693d7bef
      with:
        operation: collect
        node-id: plan
        title: plan
        adapter: native
        report-path: .quality-graph/reports/plan.json
        command-outcome: ${{ steps.reports.outcome }}
        graph-digest: ed77954b8e7e5aa796e0384c741919ba3e3b74813e65e9dd4e99c643422c4b56
        approval-findings: 'false'
        approval-files: 'false'
        approval-node: 'false'
    - name: Upload plan
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: quality-result-plan-${{ github.run_attempt }}
        path: ${{ steps.collect-plan.outputs.result-path }}
        if-no-files-found: error
        retention-days: 7
    - name: TEST ONLY duplicate Upload plan
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: quality-result-plan-${{ github.run_attempt }}
        path: ${{ steps.collect-plan.outputs.result-path }}
        if-no-files-found: error
        retention-days: 7
    - name: Collect fast
      id: collect-fast
      if: always()
      uses: alchemmist/quality-graph@caf5366a04ca01b230f1df5585d0fbd9693d7bef
      with:
        operation: collect
        node-id: fast
        title: fast
        adapter: native
        report-path: .quality-graph/reports/fast.json
        command-outcome: ${{ steps.reports.outcome }}
        graph-digest: ed77954b8e7e5aa796e0384c741919ba3e3b74813e65e9dd4e99c643422c4b56
        approval-findings: 'false'
        approval-files: 'false'
        approval-node: 'false'
    - name: Upload fast
      if: always()
