# One authoritative CI run; category inventories also back make test.
name: Quality Graph
'on':
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * *'
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: repository-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.policy.outputs.full }}
      mode: ${{ steps.policy.outputs.mode }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: 'false'
        fetch-depth: '0'
    - name: Select checks conservatively
      id: policy
      env:
        BASE_REF: ${{ github.event.pull_request.base.sha }}
        EVENT: ${{ github.event_name }}
      run: |
        python3 tools/verification/ci.py plan --base "$BASE_REF" --event "$EVENT" > /tmp/test-plan.json
        cat /tmp/test-plan.json
        python3 -c 'import json; p=json.load(open("/tmp/test-plan.json")); print("full="+str(p["full"]).lower())' >> "$GITHUB_OUTPUT"
        python3 -c 'import json; p=json.load(open("/tmp/test-plan.json")); print("mode="+p["mode"])' >> "$GITHUB_OUTPUT"
        printf '\n### Selected checks\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
        cat /tmp/test-plan.json >> "$GITHUB_STEP_SUMMARY"
        printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
  fast:
    needs: plan
    if: needs.plan.outputs.mode != 'harness'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: 'false'
        fetch-depth: '0'
    - uses: ./.github/actions/setup-runtime
    - name: Syntax, architecture and verification policy
      run: |
        make lint architecture-check
        python3 tools/delivery/render-dependencies.py --check
        python3 tests/Verification/development_setup_001_test.py
        python3 tests/Verification/verification_ci_001_test.py
        uv sync --frozen
        uv run --frozen python tools/delivery/render-current-quality-graph.py --check
        python3 tools/delivery/check-current-quality-graph.py --root .
        git diff --check
  harness:
    needs: plan
    if: needs.plan.outputs.mode == 'harness'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: 'false'
        fetch-depth: '0'
    - name: Run bounded agent delivery harness verification
      run: python3 tools/delivery/verify.py
  unit:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: 'false'
        fetch-depth: '0'
    - uses: ./.github/actions/setup-runtime
    - name: Run unit category once
      run: make test CATEGORY=unit
  integration:
    name: Integration (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: 'false'
        fetch-depth: '0'
    - uses: ./.github/actions/setup-runtime
    - name: Prepare pinned integration dependencies
      run: make ci-setup
    - name: Prepare isolated test database
      run: make test-db-reset migrate
    - name: Run integration category once
      run: make test CATEGORY=integration SHARD=${{ matrix.shard }}/2
    - name: Tear down isolated test database
      if: always()
      run: make test-env-down
  e2e:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: 'false'
        fetch-depth: '0'
    - uses: ./.github/actions/setup-runtime
    - name: Prepare pinned integration dependencies
      run: make ci-setup
    - name: Prepare isolated test database
      run: make test-db-reset migrate
    - name: Run e2e category once
      run: make test CATEGORY=e2e
    - name: Tear down isolated test database
      if: always()
      run: make test-env-down
  governance:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: 'false'
        fetch-depth: '0'
    - uses: ./.github/actions/setup-runtime
    - name: Run governance category once
      run: make test CATEGORY=governance
  verify:
    if: always()
    needs: [plan, fast, harness, unit, integration, e2e, governance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: 'false'
        fetch-depth: '0'
    - name: Require every expected result
      env:
        FULL: ${{ needs.plan.outputs.full }}
        MODE: ${{ needs.plan.outputs.mode }}
        RESULTS: '{"plan":"${{ needs.plan.result }}","fast":"${{ needs.fast.result }}","harness":"${{ needs.harness.result }}","unit":"${{ needs.unit.result }}","integration":"${{ needs.integration.result }}","e2e":"${{ needs.e2e.result }}","governance":"${{ needs.governance.result }}"}'
      run: python3 tools/verification/ci.py aggregate --full "$FULL" --mode "$MODE" --results "$RESULTS"
  quality-results:
    if: always() && github.event_name == 'pull_request' && needs.plan.outputs.mode != 'harness'
    needs: [plan, fast, harness, unit, integration, e2e, governance, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: 'false'
        fetch-depth: '0'
    - name: Render native Quality Graph reports
      id: reports
      env:
        FULL: ${{ needs.plan.outputs.full || 'unknown' }}
        RESULTS: '{"plan":"${{ needs.plan.result }}","fast":"${{ needs.fast.result }}","unit":"${{ needs.unit.result }}","integration":"${{ needs.integration.result }}","e2e":"${{ needs.e2e.result }}","governance":"${{ needs.governance.result }}","verify":"${{ needs.verify.result }}"}'
      run: python3 tools/delivery/quality-graph-report.py --full "$FULL" --results-json "$RESULTS" --graph-digest ed77954b8e7e5aa796e0384c741919ba3e3b74813e65e9dd4e99c643422c4b56 --output-dir .quality-graph/reports
    - name: Collect plan
      id: collect-plan
      if: always()
      uses: alchemmist/quality-graph@caf5366a04ca01b230f1df5585d0fbd9693d7bef
      with:
        operation: collect
        node-id: plan
        title: plan
        adapter: native
        report-path: .quality-graph/reports/plan.json
        command-outcome: ${{ steps.reports.outcome }}
        graph-digest: ed77954b8e7e5aa796e0384c741919ba3e3b74813e65e9dd4e99c643422c4b56
        approval-findings: 'false'
        approval-files: 'false'
        approval-node: 'false'
    - name: Upload plan
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: quality-result-plan-${{ github.run_attempt }}
        path: ${{ steps.collect-plan.outputs.result-path }}
        if-no-files-found: error
        retention-days: 7
    - name: Collect fast
      id: collect-fast
      if: always()
      uses: alchemmist/quality-graph@caf5366a04ca01b230f1df5585d0fbd9693d7bef
      with:
        operation: collect
        node-id: fast
        title: fast
        adapter: native
        report-path: .quality-graph/reports/fast.json
        command-outcome: ${{ steps.reports.outcome }}
        graph-digest: ed77954b8e7e5aa796e0384c741919ba3e3b74813e65e9dd4e99c643422c4b56
        approval-findings: 'false'
        approval-files: 'false'
        approval-node: 'false'
    - name: Upload fast
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: quality-result-fast-${{ github.run_attempt }}
        path: ${{ steps.collect-fast.outputs.result-path }}
