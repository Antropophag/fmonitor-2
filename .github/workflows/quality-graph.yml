# Generated by Quality Graph. DO NOT EDIT MANUALLY. Update quality-graph.yml and run qg generate.
---
name: Quality Graph
'on':
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: quality-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  delivery-evidence:
    name: SSD/TDD delivery evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: 'false'
          fetch-depth: '0'
      - run: make delivery-evidence-check
        name: Run SSD/TDD delivery evidence
        id: quality-command
        continue-on-error: true
      - name: Collect SSD/TDD delivery evidence result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@caf5366a04ca01b230f1df5585d0fbd9693d7bef
        with:
          operation: collect
          node-id: delivery-evidence
          title: SSD/TDD delivery evidence
          adapter: exit-code
          report-path: ''
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: 20ea1f95906a0ce54c1d35eead68bb78b0ee728146423257f54bedddc5975e4b
          approval-findings: 'false'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload SSD/TDD delivery evidence result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-result-delivery-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/delivery-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce SSD/TDD delivery evidence result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: 'false'
          fetch-depth: '0'
      - run: make fresh-test-verify
        name: Run Repository verification
        id: quality-command
        continue-on-error: true
      - name: Collect Repository verification result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@caf5366a04ca01b230f1df5585d0fbd9693d7bef
        with:
          operation: collect
          node-id: verify
          title: Repository verification
          adapter: exit-code
          report-path: ''
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: 20ea1f95906a0ce54c1d35eead68bb78b0ee728146423257f54bedddc5975e4b
          approval-findings: 'false'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload Repository verification result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-result-verify-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/verify.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Repository verification result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
    needs:
      - delivery-evidence
