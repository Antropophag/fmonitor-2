# Generated by Quality Graph. DO NOT EDIT MANUALLY. Update quality-graph.yml and run qg generate.
---
name: Quality Graph
'on':
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: quality-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  graph-validation:
    name: Quality Graph declaration and publisher validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: 'false'
          fetch-depth: '0'
      - name: Install exact Quality Graph toolchain
        run: python -m pip install quality-graph-cli==0.1.7 quality-graph-github==0.1.7
      - run: make quality-graph-validate
        name: Run Quality Graph declaration and publisher validation
        id: quality-command
        continue-on-error: true
      - name: Collect Quality Graph declaration and publisher validation result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@caf5366a04ca01b230f1df5585d0fbd9693d7bef
        with:
          operation: collect
          node-id: graph-validation
          title: Quality Graph declaration and publisher validation
          adapter: exit-code
          report-path: ''
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: 9ec2219042f754251199f03f6c217edd91776199e9c7d6e20c281e233a724ab8
          approval-findings: 'false'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload Quality Graph declaration and publisher validation result
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: quality-result-graph-validation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/graph-validation.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Quality Graph declaration and publisher validation result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
  delivery-evidence:
    name: SSD/TDD delivery evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: 'false'
          fetch-depth: '0'
      - name: Install exact Quality Graph toolchain
        run: python -m pip install quality-graph-cli==0.1.7 quality-graph-github==0.1.7
      - run: make delivery-evidence-check
        name: Run SSD/TDD delivery evidence
        id: quality-command
        continue-on-error: true
      - name: Collect SSD/TDD delivery evidence result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@caf5366a04ca01b230f1df5585d0fbd9693d7bef
        with:
          operation: collect
          node-id: delivery-evidence
          title: SSD/TDD delivery evidence
          adapter: exit-code
          report-path: ''
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: 9ec2219042f754251199f03f6c217edd91776199e9c7d6e20c281e233a724ab8
          approval-findings: 'false'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload SSD/TDD delivery evidence result
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: quality-result-delivery-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/delivery-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce SSD/TDD delivery evidence result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
    needs:
      - graph-validation
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: 'false'
          fetch-depth: '0'
      - name: Install exact Quality Graph toolchain
        run: python -m pip install quality-graph-cli==0.1.7 quality-graph-github==0.1.7
      - run: make fresh-test-verify
        name: Run Repository verification
        id: quality-command
        continue-on-error: true
      - name: Collect Repository verification result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@caf5366a04ca01b230f1df5585d0fbd9693d7bef
        with:
          operation: collect
          node-id: verify
          title: Repository verification
          adapter: exit-code
          report-path: ''
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: 9ec2219042f754251199f03f6c217edd91776199e9c7d6e20c281e233a724ab8
          approval-findings: 'false'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload Repository verification result
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: quality-result-verify-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/verify.json
