schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Product truth lives in PRODUCT.md and CONTEXT.md. Pilot behavior contracts live in docs/fmonitor-2-pilot-spec.md and docs/fmonitor-2-pilot-data-model.md.
  OpenSpec is the lifecycle for new migration slices; it does not replace the mandatory SSD + TDD gates in docs/development-process.md.
  Each state-changing capability has exactly one public application seam. Preserve append-only domain history.
  rapid-pilot is a behavioral oracle and temporary adapter; do not add new domain logic there.

rules:
  proposal:
    - "Name the behavior slice, actor, source oracle, target public seam, release value, and explicit non-goals."
    - "Mark unresolved product semantics as NEEDS_GRILL and name the blocked slices; never convert UNKNOWN observations into requirements."
  specs:
    - "Every requirement must be observable at the public seam and include authorization, rejected cases, audit/history, and idempotency or concurrency expectations where relevant."
    - "Expected examples must come from approved product evidence, not the implementation under migration."
  design:
    - "State the owning module, allowed dependencies, persistence owner, rapid-pilot adapter, and architecture-check impact."
  tasks:
    - "Encode the mandatory order: executable spec approval, RED, independent test review, minimal GREEN, regression and architecture checks, independent code review."
    - "Keep one vertical behavior slice per change and include characterization plus a clear Done definition."

operations:
  apply:
    guidance:
      - "Never mark implementation tasks complete before the corresponding project gate is approved and recorded."
      - "Keep READY work moving while unrelated NEEDS_GRILL decisions await the owner."
