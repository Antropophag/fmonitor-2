function manager(){return shell('Контроль монтажа','Только доказуемые сроки и объяснимые сигналы.',`<div class="list"><div class="row head"><div>Объект</div><div>Сигнал</div><div>Расчёт срока</div><div>Основание</div></div><div class="row"><div><div class="row-title">Объект монтажа № ${state.installationObject.id}</div><div class="sub">${state.installationObject.reg}</div></div><div>${status('Скоро срок','warn')}<div class="sub">Подготовить распоряжение</div></div><div><b>T−1 · 30.09.2026</b><div class="sub">Плановое начало ${state.installationObject.planned}</div></div><div><button class="link" data-action='${JSON.stringify({type:'NAV',screen:'object',tab:'docs'})}'>Открыть документы</button></div></div></div>`)}
function objects(){const open=JSON.stringify({type:'NAV',screen:'object',tab:'overview'});return shell('Объекты монтажа','Общий справочник без широкого реестра: поиск, состояние процесса и требуемый следующий шаг.',`<section class="panel"><div class="catalog-toolbar"><label class="shlz-field"><span class="shlz-field__label">Заводской номер лифта, регномер или адрес</span><span class="shlz-field__control"><input class="shlz-input" placeholder="Например, 4512 или Примерная"></span></label><label class="shlz-field"><span class="shlz-field__label">Состояние</span><span class="shlz-field__control"><select class="shlz-select"><option>Все состояния</option><option>Требуется действие</option><option>В работе</option><option>Завершено</option><option>Только legacy</option></select></span></label>${button('Найти',{type:'NAV',screen:'objects'},'btn primary')}</div></section><div class="catalog-summary"><span>Найдено 184 объекта · обновлено из ERP сегодня в 08:15</span><span>Сначала требующие действия</span></div><section class="list" aria-label="Найденные объекты"><div class="object-list-item object-list-head"><div>Объект</div><div>Ключевая дата</div><div>Состояние</div><div>Следующий шаг</div></div><article class="object-list-item"><div><button class="link row-title" data-action='${open}'>Заводской номер лифта ${state.installationObject.id}</button><div class="sub">${state.installationObject.reg} · ${state.installationObject.address}</div></div><div><b>${state.installationObject.opened?state.installationObject.nextInspection:state.installationObject.planned}</b><div class="sub">${state.installationObject.opened?'следующая инспекция':'плановое начало'}</div></div><div>${status(labels[state.installationObject.status],state.installationObject.opened?'ok':'warn')}<div class="progress-track"><span style="width:${state.installationObject.progress}%"></span></div><div class="sub">${state.installationObject.progress}% · факт ${state.installationObject.lastInspection}</div></div><div><b>${state.installationObject.opened?'Зафиксировать ход работ':'Сформировать распоряжение'}</b><div class="sub">Владелец: ${state.installationObject.opened?'стройконтроль':'ФКР'} · ${state.installationObject.opened?'просрочено на 2 дня':'до срока 35 дней'}</div></div></article><article class="object-list-item"><div><button class="link row-title" data-action='${open}'>Заводской номер лифта 4489</button><div class="sub">ЛФ-77-18117 · Москва, ул. Строителей, 8 · подъезд 1</div></div><div><b>12.09.2026</b><div class="sub">плановое окончание</div></div><div>${status('В работе','ok')}<div class="progress-track"><span style="width:85%"></span></div><div class="sub">85% · факт 25.08.2026</div></div><div><b>Контроль завершения</b><div class="sub">Инженер Петров · рисков нет</div></div></article><article class="object-list-item"><div><button class="link row-title" data-action='${open}'>Заводской номер лифта 4391</button><div class="sub">ЛФ-77-17520 · Москва, Варшавское ш., 42 · подъезд 3</div></div><div><b>28.08.2026</b><div class="sub">плановое начало</div></div><div>${status('Только legacy')}<div class="sub">процессная история не создана</div></div><div><b>Доступно чтение карточки</b><div class="sub">Риски 2.0 пока не вычисляются</div></div></article><article class="object-list-item"><div><button class="link row-title" data-action='${open}'>Заводской номер лифта 4560</button><div class="sub">ЛФ-77-18511 · Москва, Каширское ш., 19 · секция Б</div></div><div><b>07.10.2026</b><div class="sub">плановое начало</div></div><div>${status('Заблокирован','danger')}<div class="sub">нет допустимого инженера</div></div><div><b>Назначить владельца данных</b><div class="sub">Команда ФКР недоступна до устранения причины</div></div></article></section>`,button('Сбросить фильтры',{type:'NAV',screen:'objects'},'btn sm'))}
function installers(){return shell('Монтажники','Кадровая допустимость, назначения и документы-основания.',`<div class="list"><div class="row head"><div>Монтажник</div><div>Кадровый статус</div><div>Загрузка</div><div>Доступность</div></div><div class="row"><div><div class="row-title">Иванов Сергей</div><div class="sub">таб. 10482 · электромеханик</div></div><div>${status('Работает','ok')}</div><div>Объект монтажа № 4512<div class="sub">ещё 1 назначение</div></div><div>${status('Доступен','ok')}</div></div><div class="row"><div><div class="row-title">Петров Алексей</div><div class="sub">таб. 10817 · электромеханик</div></div><div>${status('Уволен','danger')}</div><div>Нет назначений</div><div>${status('Нельзя выбрать','danger')}<div class="sub">уволен 24.08.2026</div></div></div></div>`)}
function renderNav(){document.getElementById('nav').innerHTML=navItems().map(([id,l])=>`<button class="${state.screen===id?'active':''}" data-action='${JSON.stringify({type:'NAV',screen:id})}'>${l}</button>`).join('')}
function renderScreen(){const fn={queue,objects,object,order_form:assignmentOrderForm,engineer,inspection,otiz,manager,installers}[state.screen]||object;document.getElementById('screen').innerHTML=fn();document.getElementById('crumb').textContent=roles[state.role]+' / '+({queue:'Моя работа',objects:'Объекты монтажа',object:'Карточка объекта',order_form:'Распоряжение',engineer:'Инспекции',inspection:'Фиксация хода работ',otiz:'Расчёты',manager:'Контроль',installers:'Монтажники'}[state.screen]||'Объект');document.getElementById('topState').textContent=labels[state.installationObject.status]+' · '+(state.installationObject.opened?'прогресс ':'legacy ')+state.installationObject.progress+'%'}
const scenarios={fkr:{title:'ФКР: открыть работы',copy:'Сформируйте распоряжение, попробуйте оба варианта спорного шлюза и откройте работы.',steps:[['Сбросить',{type:'RESET'}],['ФКР',{type:'ROLE',role:'fkr'}],['Мастер',{type:'NAV',screen:'order_form'}],['Сформировать',{type:'PREPARE'}],['Разрешить по проекту',{type:'GATE',gate:'project_allowed'}],['Открыть',{type:'OPEN'}],['Карточка',{type:'NAV',screen:'object'}]]},inspection:{title:'Стройконтроль',copy:'Откройте объект, зафиксируйте новый этап и посмотрите, как изменилась динамика.',steps:[['Подготовить объект',{type:'RESET'}],['Стройконтроль',{type:'ROLE',role:'engineer'}],['Допустить открытие',{type:'GATE',gate:'project_allowed'}],['Сформировать',{type:'PREPARE'}],['Открыть',{type:'OPEN'}],['Форма инспекции',{type:'NAV',screen:'inspection'}],['Зафиксировать +15 п.п.',{type:'INSPECT'}],['Работы',{type:'NAV',screen:'object',tab:'works'}]]},otiz:{title:'ОТиЗ: дельта и выплата',copy:'Создайте срез после новой инспекции, зафиксируйте его и отдельно запишите выплату.',steps:[['Сбросить',{type:'RESET'}],['ОТиЗ',{type:'ROLE',role:'otiz'}],['Рассчитать',{type:'CALC'}],['Зафиксировать срез',{type:'FIX'}],['Зафиксировать выплату',{type:'PAY'}]]}};
let scenario='fkr',step=0,walkOpen=false;
function renderWalk(){const sc=scenarios[scenario];walkBody.innerHTML=`<div class="scenario-tabs">${Object.entries(scenarios).map(([id,x])=>`<button class="btn sm ${id===scenario?'primary':''}" data-scenario="${id}">${x.title.split(':')[0]}</button>`).join('')}</div><p class="walk-copy">${sc.copy}</p><div class="steps">${sc.steps.map(([l,a],i)=>`<button class="step ${i<step?'done':i===step?'current':''}" data-step="${i}" data-step-action='${JSON.stringify(a)}'>${i+1}. ${l}</button>`).join('')}</div><div class="state-strip">Сейчас: ${labels[state.installationObject.status]} · прогресс ${state.installationObject.progress}% · выплачено ${money(state.payments)}<br>Изменение: ${state.lastChange}</div>`;walkBody.classList.toggle('hidden',!walkOpen);toggleWalk.textContent=walkOpen?'Свернуть':'Развернуть'}
function setObjectVariant(variant){objectVariant=variant;const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);renderScreen();renderVariantSwitcher()}
function renderVariantSwitcher(){variantSwitcher.hidden=state.screen!=='object';if(variantSwitcher.hidden)return;const variants=Object.keys(objectVariantNames),i=variants.indexOf(objectVariant),prev=variants[(i-1+variants.length)%variants.length],next=variants[(i+1)%variants.length];variantSwitcher.innerHTML=`<button data-variant="${prev}" aria-label="Предыдущий вариант">←</button><span class="variant-label">${objectVariant} · ${objectVariantNames[objectVariant]}</span><button data-variant="${next}" aria-label="Следующий вариант">→</button>`}
function render(){document.getElementById('role').value=state.role;renderNav();renderScreen();renderWalk();renderVariantSwitcher()}
document.addEventListener('click',e=>{const variant=e.target.closest('[data-variant]');if(variant){setObjectVariant(variant.dataset.variant);return}const b=e.target.closest('[data-action]');if(b){dispatch(JSON.parse(b.dataset.action));return}const st=e.target.closest('[data-step]');if(st){const i=+st.dataset.step;if(i===0)step=0;dispatch(JSON.parse(st.dataset.stepAction));step=Math.max(step,i+1);renderWalk();return}const sc=e.target.closest('[data-scenario]');if(sc){scenario=sc.dataset.scenario;step=0;dispatch({type:'RESET'});return}});
document.addEventListener('keydown',e=>{if(state.screen!=='object'||!['ArrowLeft','ArrowRight'].includes(e.key)||e.target.closest('input,textarea,select,[contenteditable]'))return;const variants=Object.keys(objectVariantNames),i=variants.indexOf(objectVariant),delta=e.key==='ArrowLeft'?-1:1;setObjectVariant(variants[(i+delta+variants.length)%variants.length])});
document.getElementById('role').addEventListener('change',e=>dispatch({type:'ROLE',role:e.target.value,label:'Роль изменена'}));
toggleWalk.addEventListener('click',()=>{walkOpen=!walkOpen;walkBody.classList.toggle('hidden',!walkOpen);toggleWalk.textContent=walkOpen?'Свернуть':'Развернуть'});
render();
</script>
</body>
</html>
